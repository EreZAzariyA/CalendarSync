<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#3B82F6"/>
  <!-- Calendar body -->
  <rect x="6" y="10" width="20" height="16" rx="2" fill="white" fill-opacity="0.15"/>
  <rect x="6" y="10" width="20" height="16" rx="2" stroke="white" stroke-width="1.5"/>
  <!-- Calendar top bar -->
  <rect x="6" y="10" width="20" height="6" rx="2" fill="white" fill-opacity="0.3"/>
  <!-- Calendar hooks -->
  <line x1="11" y1="7" x2="11" y2="13" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="7" x2="21" y2="13" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Check mark inside calendar -->
  <path d="M12 20.5L15 23.5L20.5 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
